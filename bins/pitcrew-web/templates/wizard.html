<p><a href="/report?{{ITEM_QUERY}}">Choose a different problem</a></p><h1>A quick check</h1><p><strong>{{TITLE}}</strong><br>{{LIBRARY}}</p><form action="/report" method="post"><input type="hidden" name="item" value="{{ITEM}}"><input type="hidden" name="csrf" value="{{CSRF}}"><input type="hidden" name="nonce" value="{{NONCE}}"><input type="hidden" name="issue" value="{{ISSUE}}"><label for="answer">{{QUESTION}}</label><p class="hint">{{ADVICE}}</p><select id="answer" name="answer" required>{{OPTIONS}}</select><label for="details">{{DETAILS_LABEL}} <span class="hint">{{DETAILS_OPTIONAL}}</span></label><textarea id="details" name="text" maxlength="{{DETAILS_MAX}}" {{DETAILS_REQUIRED}} rows="5" aria-describedby="details-hint"></textarea><p id="details-hint" class="hint">The device, error message, or time where it stops can help. Do not include passwords.</p><button>Send report</button></form>
