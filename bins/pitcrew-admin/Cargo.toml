[package]
name = "pitcrew-admin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8"
pitcrew-domain = { path = "../../crates/domain" }
pitcrew-store = { path = "../../crates/store" }
pitcrew-deciders = { path = "../../crates/deciders" }
pitcrew-config = { path = "../../crates/config" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
url = "2"
getrandom = "0.4"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
pitcrew-intake-store = { path = "../../crates/intake-store" }
pitcrew = { path = "../pitcrew" }
pitcrew-engine = { path = "../../crates/engine" }

[lints]
workspace = true
