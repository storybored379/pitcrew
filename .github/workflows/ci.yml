name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install local media fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Privacy, formatting, clippy, tests and scenarios
        run: cargo xtask check

  mutations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package:
          - pitcrew-domain
          - pitcrew-agent-core
          - pitcrew-arbiter
          - pitcrew-engine
          - pitcrew-store
          - pitcrew-arr
          - pitcrew
          - pitcrew-diagnosis
          - pitcrew-deciders
          - pitcrew-intake
          - pitcrew-intake-store
          - pitcrew-web
          - pitcrew-bot
          - pitcrew-drill
          - pitcrew-sync
          - pitcrew-bridge
          - pitcrew-admin
          - pitcrew-setup
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install local media fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install mutation runner
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Fetch locked workspace dependencies for offline mutation copies
        run: cargo fetch --locked
      - name: Enforce every mutant in this package
        run: cargo xtask mutants "${{ matrix.package }}"
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-results-${{ matrix.package }}
          path: mutants.out*/
          if-no-files-found: ignore
          retention-days: 14
