name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_BUILD_JOBS: "4"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install local media fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Privacy, formatting, clippy, tests and scenarios
        run: cargo xtask check

  mutations:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        package:
          - pitcrew-domain
          - pitcrew-agent-core
          - pitcrew-arbiter
          - pitcrew-engine
          - pitcrew-store
          - pitcrew-arr
          - pitcrew
          - pitcrew-diagnosis
          - pitcrew-deciders
          - pitcrew-intake
          - pitcrew-intake-store
          - pitcrew-web
          - pitcrew-bot
          - pitcrew-drill
          - pitcrew-sync
          - pitcrew-bridge
          - pitcrew-admin
          - pitcrew-setup
          - pitcrew-notify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install local media fixture tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install mutation runner
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: Fetch locked workspace dependencies for offline mutation copies
        run: cargo fetch --locked
      - name: Enforce every mutant in this package
        run: cargo xtask mutants "${{ matrix.package }}"
      - name: Retain mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-results-${{ matrix.package }}
          path: mutants.out*/
          if-no-files-found: ignore
          retention-days: 14

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build slim stack and FFmpeg agent images (no push)
        run: |
          docker build -f Dockerfile.stack -t pitcrew-stack:local .
          docker build -f Dockerfile.agent -t pitcrew-agent:local .
      - name: Exercise Compose against an isolated loopback fake
        run: python3 -B packaging/tests/smoke.py
